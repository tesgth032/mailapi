name: mailapi

x-mailapi-common: &mailapi-common
  image: ${MAILAPI_IMAGE:-ghcr.io/tesgth032/mailapi:latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    MAILAPI_CONFIG: /etc/mailapi/config.yaml
  volumes:
    - ./docker/config.docker.yaml:/etc/mailapi/config.yaml:ro

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MAILAPI_INFRA_BIND:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${MAILAPI_INFRA_BIND:-127.0.0.1}:6379:6379"

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports:
      - "${MAILAPI_INFRA_BIND:-127.0.0.1}:4222:4222"
    volumes:
      - nats_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MAILAPI_MINIO_ROOT_USER:-mailapi}
      MINIO_ROOT_PASSWORD: ${MAILAPI_MINIO_ROOT_PASSWORD:-mailapi-local-secret}
    ports:
      - "${MAILAPI_INFRA_BIND:-127.0.0.1}:9000:9000"
      - "${MAILAPI_INFRA_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data

  api:
    <<: *mailapi-common
    command: ["api"]
    depends_on:
      - mongodb
      - redis
      - minio
    ports:
      - "${MAILAPI_API_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "mailapi-healthcheck", "api"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  smtp:
    <<: *mailapi-common
    command: ["smtp"]
    depends_on:
      - redis
      - nats
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${MAILAPI_SMTP_BIND:-0.0.0.0}:25:25"
    healthcheck:
      test: ["CMD", "mailapi-healthcheck", "smtp"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *mailapi-common
    command: ["worker"]
    depends_on:
      - mongodb
      - redis
      - nats
      - minio
    healthcheck:
      test: ["CMD", "mailapi-healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  nats_data:
  minio_data:
