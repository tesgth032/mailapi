name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          go build -trimpath -o /tmp/mailapi-api ./cmd/api
          go build -trimpath -o /tmp/mailapi-smtp ./cmd/smtp
          go build -trimpath -o /tmp/mailapi-worker ./cmd/worker

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mailapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image entrypoints
        run: |
          docker run --rm -v "$PWD/docker/config.docker.yaml:/etc/mailapi/config.yaml:ro" mailapi:ci api --check-config
          docker run --rm -v "$PWD/docker/config.docker.yaml:/etc/mailapi/config.yaml:ro" mailapi:ci smtp --check-config
          docker run --rm -v "$PWD/docker/config.docker.yaml:/etc/mailapi/config.yaml:ro" mailapi:ci worker --check-config
